<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Assistant Cat — Organização pessoal com clareza, privacidade e assistência inteligente." />
    <meta name="theme-color" content="#121212" />
    <!-- Metas OG relativas por padrão (dev). Em produção, o plugin de app/vite.config.ts
         reescreve og:image/twitter:image para absolutas e injeta og:url + canonical
         quando VITE_SITE_URL está definida. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Assistant Cat — Organização pessoal com clareza e privacidade" />
    <meta property="og:description" content="Agenda, afazeres e memórias no seu dispositivo. Local, gratuito e de código aberto." />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./og-image.png" />
    <title>Assistant Cat — Seu Gato Assistente</title>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-[var(--accent-soft)]">
    <div id="root"></div>
    <script>
      // Evita flash de tema errado quando o app é aberto em modo claro.
      try {
        var saved = localStorage.getItem('assistant-cat-theme');
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
