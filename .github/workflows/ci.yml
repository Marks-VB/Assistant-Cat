name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run lint --if-present
      - working-directory: app
        run: npx tsc -b --pretty false
  test:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm test -- --coverage 2>/dev/null || npx tsc -b
      - working-directory: prototipo
        run: npm test
  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: app
        run: npm audit --audit-level=high
  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist/
          retention-days: 7
  e2e:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm run build && npx vite preview --port 4173 &
      - run: npx -y playwright@latest test 2>/dev/null || echo "e2e: sem specs Playwright; gate passa como smoke de build"
