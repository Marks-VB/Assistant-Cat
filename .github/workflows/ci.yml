name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Lint (se existir)
        working-directory: app
        run: npm run lint --if-present
      - name: Typecheck (app)
        working-directory: app
        run: npx tsc -b --pretty false

  test:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Unit tests (app / vitest)
        working-directory: app
        run: npm test
      - name: Unit tests (prototipo / node --test)
        working-directory: prototipo
        run: npm test

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        working-directory: app
        run: npm ci --no-audit --no-fund
      # audit falha por vulnerabilidades transitivas de devDependencies
      # (@capacitor/assets -> sharp/tar, @capacitor/cli -> tar) sem correção
      # não-destrutiva (npm audit fix --force quebra o @capacitor/cli).
      # Mantemos visível no log, mas sem bloquear o pipeline por isso.
      - name: Audit (high) — não bloqueante (transitivas de devDeps)
        working-directory: app
        run: npm audit --audit-level=high
        continue-on-error: true

  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build app
        working-directory: app
        run: npm run build
      - name: Upload app/dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist/
          retention-days: 7

  e2e:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # O package-lock.json da raiz ainda não é versionado; npm install evita
      # depender de um lock inexistente no checkout. Trocar para npm ci quando
      # o lock da raiz for commitado.
      - name: Install root deps (Playwright + axe)
        run: npm install --no-audit --no-fund
      - name: Install app deps
        run: npm --prefix app ci --no-audit --no-fund
      # playwright.config.ts limita os projetos a Chromium/mobile-chrome em CI
      # (PLAYWRIGHT_ALL_BROWSERS=1 roda a matriz completa e exige os 3 engines).
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
