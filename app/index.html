<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Assistant Cat — Organização pessoal com clareza, privacidade e assistência inteligente." />
    <meta name="theme-color" content="#121212" />
    <title>Assistant Cat — Seu Gato Assistente</title>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-[var(--accent-soft)]">
    <div id="root"></div>
    <script>
      // Evita flash de tema errado quando o app é aberto em modo claro.
      try {
        var saved = localStorage.getItem('assistant-cat-theme');
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
